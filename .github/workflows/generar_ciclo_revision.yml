name: Generar Ciclo de Revisión de Proyectores (Mantención)

# Sólo agenda PROYECTORES (revisión ~mensual). Las impresoras se revisan
# ~2 veces por semana con un calendario aún por confirmar con el equipo:
# mientras tanto, sus ciclos se abren a mano con el botón "Nuevo
# ciclo/revisión" en /mantencion/revision/impresoras/. Una vez confirmada
# la frecuencia exacta, se puede agregar otro job igual a éste pero con
# "python manage.py generar_ciclo_revision IMPR" y su propio cron.

on:
  schedule:
    # Se ejecuta a las 13:00 UTC del día 1 de cada mes
    # (10:00 AM Chile Verano / 09:00 AM Chile Invierno aprox.)
    - cron: '0 13 1 * *'

  # Permite ejecutarlo manualmente desde la pestaña "Actions" para probar
  workflow_dispatch:

jobs:
  generar_ciclo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar comando de generación del ciclo
      env:
        # Mapeamos los Secretos de GitHub a Variables de Entorno
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: 'False'
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      run: |
        python manage.py generar_ciclo_revision PROY
