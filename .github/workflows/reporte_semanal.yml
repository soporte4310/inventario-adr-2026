name: Reporte Semanal de Inventario

on:
  schedule:
    # Se ejecuta a las 14:00 UTC (11:00 AM Chile Verano / 10:00 AM Chile Invierno)
    # Todos los domingos (0)
    - cron: '0 14 * * 0'
  
  # Permite ejecutarlo manualmente desde la pestaña "Actions" para probar
  workflow_dispatch:

jobs:
  enviar_reporte:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar comando de reporte
      env:
        # Mapeamos los Secretos de GitHub a Variables de Entorno
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: 'False'
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        # Lista de destinatarios del reporte (separados por coma)
        EMAIL_RECIPIENTS: 'wtapia@inacap.cl,hleris@inacap.cl,mvergarao@inacap.cl,jhonorato@inacap.cl,algonzalezv@inacap.cl,envarrom@inacap.cl,farnaldi@inacap.cl,pcasanga@inacap.cl'
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      run: |
        python manage.py enviar_reporte
