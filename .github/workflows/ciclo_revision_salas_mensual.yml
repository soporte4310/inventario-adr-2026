name: Generar Ciclo de Revisión Mensual de Salas de Clases

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 11:00 UTC (08:00 AM Chile Continental)
    - cron: '0 11 1 * *'
  workflow_dispatch: # Permite ejecución manual con un botón en GitHub

jobs:
  crear-ciclo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar comando de creación
        env:
          # Secretos configurados en el repositorio de GitHub (Settings > Secrets and variables > Actions)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: 'core.settings.production'
        run: |
          python manage.py generar_ciclo_revision_salas