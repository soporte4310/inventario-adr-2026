{% extends 'base.html' %}
{% load static %}

{% block title %} Inicio {% endblock %}

{% block content %}

<style>
    .cardTitle {
        min-height: 2.4em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(16px, 1.9vw, 20px);
    }

    /* Ajuste solo para títulos largos que quieres en una sola línea - DEPRECADO, usa estilo base */
    .cardTitle--tight {
        white-space: nowrap;
        line-height: 1.1;
    }
</style>

<div class="homeContainer">
    <div class="homeContent">
        <!-- Contenedor del buscador -->
        <div class="buscadorContainer" style="margin: 20px auto;
                    width: fit-content;
                    text-align: center;
                    border-radius: 10px;
                    overflow: hidden;
                    background: #f5f5f5;">
            <form method="get" action="{% url 'lista_activos' %}" style="display: inline-flex; gap: 10px;">
                <input type="text" id="search" name="search" placeholder="Escanea BDO, Serie, Etiqueta..."
                    style="padding: 10px; width: 300px;" required>
                <button type="submit"
                    style="padding: 10px 20px; border-radius: 10px; border: none; background-color: #9e0909; color: #fff;">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </form>
        </div>

        <div class="homeCard">

            <a href="{% url 'lista_activos' %}?categoria_nombre=All In One" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/allinone.png' %}" alt="all_in_one">
                <h2 class="cardTitle">All In One</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Notebook" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/notebook.png' %}" alt="notebook">
                <h2 class="cardTitle">Notebooks</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Mini PC" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/mini_pc.png' %}" alt="mini_pc">
                <h2 class="cardTitle">Mini PC</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Proyector" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/proyector.png' %}" alt="proyector">
                <h2 class="cardTitle">Proyectores</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Monitor" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/monitor.png' %}" alt="monitor">
                <h2 class="cardTitle">Monitores</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Televisor" class="card">
                <img class="cardImage" src="{% static 'imagenes/TV.png' %}" alt="televisor">
                <h2 class="cardTitle">Televisores</h2>
            </a>

            <!-- AQUÍ EL CAMBIO CLAVE: tipo_uso=EVE -->
            <a href="{% url 'lista_activos' %}?tipo_uso=EVE" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/eventos.png' %}" alt="eventos">
                <h2 class="cardTitle">Eventos</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Tablet" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/tablet.png' %}" alt="tablet">
                <h2 class="cardTitle">Tablets</h2>
            </a>

            <a href="{% url 'lista_activos' %}?ubicacion_nombre=Bodega ADR" class="card">
                <img class="cardImage" src="{% static 'imagenes/adr_logo_email.png' %}" alt="bodega_adr">
                <h2 class="cardTitle">Bodega ADR</h2>
            </a>

            <a href="{% url 'lista_activos' %}?ubicacion_nombre=Azotea" class="card">
                <img class="cardImage" src="{% static 'imagenes/Azotea.png' %}" alt="azotea_adr">
                <h2 class="cardTitle">Azotea</h2>
            </a>

            <a href="{% url 'lista_activos' %}?tipo_red=ISLA" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/equipo_isla.png' %}" alt="equipos_isla">
                <h2 class="cardTitle">Equipos Islas</h2>
            </a>

            <a href="{% url 'lista_activos' %}?categoria_nombre=Switch de red" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/241494-19148364.png' %}"
                    alt="switch_de_red">
                <h2 class="cardTitle">Switch de red</h2>
            </a>

            <a href="{% url 'lista_activos' %}" class="card">
                <img class="cardImage" src="{% static 'imagenes_normalizadas/241494-19148364.png' %}"
                    alt="lista_general">
                <h2 class="cardTitle">Lista de Equipos</h2>
            </a>

        </div>
    </div>
</div>

<script src="{% static 'js/search.js' %}"></script>

{% endblock %}
