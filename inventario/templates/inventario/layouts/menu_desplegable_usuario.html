<section id="MenuUsuarioDropdown" class="menu_desplegable_usuario">
    <ul class="menu_desplegable_usuario__opciones fs_pequena color_primario">

        <li class="menu_desplegable_usuario__opcion">
            <a class="fs_normal color_primario_variante" href="{% url 'my_profile' %}">
                <!-- Mi cuenta (ID Card) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
                    <rect width="18" height="14" x="3" y="5" rx="2"/><line x1="7" x2="11" y1="10" y2="10"/><line x1="7" x2="11" y1="14" y2="14"/><path d="M15 10v4"/>
                </svg>
                Mi cuenta
            </a>
        </li>
        
        <li class="menu_desplegable_usuario__opcion">
            <a class="fs_normal color_primario_variante" href="">
                <!-- Información (Circle Info) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
                    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                </svg>
                Información del sistema
            </a>
        </li>

        {% if user.is_staff %}
        <li class="menu_desplegable_usuario__opcion">
            <a class="fs_normal color_primario_variante" href="{% url 'admin:index' %}">
                <!-- Admin (Shield) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Panel de Administración
            </a>
        </li>
        {% endif %}

        <li class="menu_desplegable_usuario__opcion">
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
                    </svg>
                    Cerrar sesión
                </button>
            </form>
        </li>
    </ul>
</section>
