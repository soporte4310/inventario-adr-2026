{% extends 'mantencion/base_mantencion.html' %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Agregar proyector a mantención</h1>
<form method="post" class="max-w-md space-y-4">

  {% include 'mantencion/partials/campos_formulario.html' %}

</form>
{% endblock %}
