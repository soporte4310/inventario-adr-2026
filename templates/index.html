{% load static %}

<!doctype html>
<!-- Es vital que html y body tengan h-full -->
<html class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-custom {
      background-image: url('/static/Imagenes/Inacap_1.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    body, body * {
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
    }
  </style>
</head>

<body class="bg-custom bg-opacity-50 h-full m-0 flex items-center justify-center">
  
  <!-- Contenedor principal -->
  <div class="w-full max-w-sm px-6 py-12 bg-black/40 rounded-2xl backdrop-blur-md shadow-2xl flex flex-col items-center">
    
    <!-- Logo -->
    <img class="h-28 w-auto rounded-full border-4 border-white shadow-xl mb-6"
         src="{% static 'imagenes/adr_icon.png' %}" alt="Logo ADR">
         
    <!-- Título -->
    <h2 class="text-center text-2xl font-bold leading-9 tracking-tight text-white mb-10">
      SISTEMA DE GESTIÓN DE ADR
    </h2>

    <!-- Botón de acceso -->
    <a href="{% url 'dashboard_inventario' %}" 
       class="w-full text-center rounded-md bg-red-600 px-3 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-500 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600">
      Ir al Inventario
    </a>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (document.body.style.MozUserSelect !== undefined) {
        document.body.style.MozUserSelect = 'none';
      }
      document.body.onselectstart = function() { return false; };
      document.body.addEventListener('copy', function(e) {
        e.preventDefault();
        return false;
      });
      document.body.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    });
  </script>
</body>
</html>
